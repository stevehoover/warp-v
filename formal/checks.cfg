# riscv-formal configuration for WARP-V.
# The Makefile appends the [depth] section from depths/<STANDARD_CONFIG>.cfg, plus
# `define RISCV_FORMAL_COMPRESSED if EXT_C=1, to produce out/checks.cfg.

[options]
isa rv32im

[defines]
`define RISCV_FORMAL_NRET 1
`define RISCV_FORMAL_XLEN 32
`define RISCV_FORMAL_ILEN 32
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ALTOPS


[defines pc_fwd]
`define PC_CHECK

[defines pc_bwd]
`define PC_CHECK


[script-sources]
read_verilog @basedir@/../verilog/clk_gate.v
read_verilog -sv @basedir@/../verilog/pseudo_rand.sv
read_verilog -sv -I @basedir@/../verilog -I @basedir@/.. @basedir@/../wrapper.sv
read_verilog -sv -I @basedir@/../verilog -I @basedir@/.. @basedir@/../out/warp-v_formal.sv
